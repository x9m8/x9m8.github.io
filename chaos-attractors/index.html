<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chaos Attractors | x9m8</title>
<style>
:root{--bg:#07090d;--panel:#111821;--ink:#e6edf3;--mute:#8b98a8;--acc:#4cc2ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid #1f2a38;flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:600}
.sp{flex:1}
button,select{background:#1b2634;color:var(--ink);border:1px solid #2a384b;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover,select:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#04202e;border-color:var(--acc)}
#stage{flex:1;position:relative;min-height:0;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
#info{position:absolute;left:10px;bottom:8px;font-size:12px;color:#cde;background:#0009;padding:4px 8px;border-radius:4px;pointer-events:none;max-width:90%}
#ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 14px;padding:8px 12px;background:var(--panel);border-top:1px solid #1f2a38}
#ctl label{display:flex;flex-direction:column;font-size:12px;color:var(--mute)}
#ctl label b{color:var(--ink);font-weight:500}
input[type=range]{width:100%;accent-color:var(--acc)}
</style>
</head>
<body>
<div id="app">
<header>
<h1>Chaos Attractors</h1>
<select id="sys"></select>
<button id="bTwin" class="on">Twin trajectory</button>
<button id="bSpin" class="on">Auto-rotate</button>
<span class="sp"></span>
<button id="bPause">Pause</button>
<button id="bReset">Reset</button>
<button id="bFS">Full screen</button>
</header>
<div id="stage"><canvas id="c"></canvas><div id="info"></div></div>
<div id="ctl"></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
// Each system: derivative function, parameters, start state, view scale and centre
const SYS={
 lorenz:{name:'Lorenz (1963)',p:{sigma:[10,0,30,.1],rho:[28,0,60,.1],beta:[8/3,0,6,.01]},x0:[1,1,1],scale:30,ctr:[0,0,25],dt:.005,
  f:(s,p)=>[p.sigma*(s[1]-s[0]),s[0]*(p.rho-s[2])-s[1],s[0]*s[1]-p.beta*s[2]],
  note:'Lorenz derived this from a toy model of atmospheric convection. Two trajectories that start 1e-6 apart separate until the orbits are unrelated.'},
 rossler:{name:'Rössler',p:{a:[.2,0,.5,.005],b:[.2,0,.5,.005],c:[5.7,2,14,.05]},x0:[1,1,1],scale:13,ctr:[0,0,8],dt:.01,
  f:(s,p)=>[-s[1]-s[2],s[0]+p.a*s[1],p.b+s[2]*(s[0]-p.c)],
  note:'Rössler designed this as the simplest flow with chaos: one spiral plus an occasional fold. Raise c to watch it go from a loop to a period-doubling cascade and chaos.'},
 thomas:{name:'Thomas cyclically symmetric',p:{b:[.208186,0,.4,.001]},x0:[.1,0,0],scale:4.2,ctr:[0,0,0],dt:.05,
  f:(s,p)=>[Math.sin(s[1])-p.b*s[0],Math.sin(s[2])-p.b*s[1],Math.sin(s[0])-p.b*s[2]],
  note:'A friction-like parameter b sets everything. Near 0.208 it is chaotic; above about 0.32 the motion settles to a fixed point.'},
 aizawa:{name:'Aizawa',p:{a:[.95,.5,1.2,.005],b:[.7,.2,1.2,.005],c:[.6,.2,1,.005],d:[3.5,1,6,.05],e:[.25,0,.6,.005],f:[.1,0,.3,.005]},x0:[.1,0,0],scale:1.9,ctr:[0,0,.3],dt:.01,
  f:(s,p)=>[(s[2]-p.b)*s[0]-p.d*s[1],p.d*s[0]+(s[2]-p.b)*s[1],p.c+p.a*s[2]-s[2]**3/3-(s[0]*s[0]+s[1]*s[1])*(1+p.e*s[2])+p.f*s[2]*s[0]**3],
  note:'A spherical, ball-with-a-tube attractor. The shape changes noticeably with a few of the sliders.'},
 chen:{name:'Chen',p:{a:[35,20,45,.1],b:[3,1,6,.05],c:[28,15,35,.1]},x0:[-3,2,20],scale:30,ctr:[0,0,25],dt:.002,
  f:(s,p)=>[p.a*(s[1]-s[0]),(p.c-p.a)*s[0]-s[0]*s[2]+p.c*s[1],s[0]*s[1]-p.b*s[2]],
  note:'A cousin of Lorenz with a different sign structure in one term: two lobes again, but the paths cross differently.'},
 halvorsen:{name:'Halvorsen',p:{a:[1.89,1,2.5,.01]},x0:[-1.48,-1.51,2.04],scale:14,ctr:[0,0,0],dt:.005,
  f:(s,p)=>[-p.a*s[0]-4*s[1]-4*s[2]-s[1]*s[1],-p.a*s[1]-4*s[2]-4*s[0]-s[2]*s[2],-p.a*s[2]-4*s[0]-4*s[1]-s[0]*s[0]],
  note:'Three-fold symmetric: the same equation rotated through x, y and z, so it winds three arms around the origin.'}
};
let cur='lorenz',params={},A,B,trailA=[],trailB=[],twin=true,spin=true,paused=false,yaw=.6,pitch=.35,zoom=1,sep0=1e-6;
const MAX=4500;
function loadSys(k){cur=k;const S=SYS[k];params={};for(const q in S.p)params[q]=S.p[q][0];buildCtl();resetState();$('info').textContent=S.note}
function resetState(){const S=SYS[cur];A=S.x0.slice();B=S.x0.slice();B[0]+=sep0;trailA=[];trailB=[];
  // run a short warm-up so the trajectory is on the attractor
  for(let i=0;i<4000;i++){A=rk4(A,S.dt);B=rk4(B,S.dt)} B=A.slice();B[0]+=sep0;}
function rk4(s,h){const S=SYS[cur],f=S.f,p=params;const k1=f(s,p);const s2=s.map((v,i)=>v+h/2*k1[i]);const k2=f(s2,p);const s3=s.map((v,i)=>v+h/2*k2[i]);const k3=f(s3,p);const s4=s.map((v,i)=>v+h*k3[i]);const k4=f(s4,p);return s.map((v,i)=>v+h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]))}
function buildCtl(){const box=$('ctl');box.innerHTML='';const S=SYS[cur];
  for(const q in S.p){const [v,mn,mx,st]=S.p[q];const l=document.createElement('label');l.innerHTML=`${q} <b id="v_${q}">${(+v).toFixed(3)}</b>`;const r=document.createElement('input');r.type='range';r.min=mn;r.max=mx;r.step=st;r.value=v;r.oninput=()=>{params[q]=+r.value;$('v_'+q).textContent=(+r.value).toFixed(3);trailA=[];trailB=[]};l.appendChild(r);box.appendChild(l)}
  const l=document.createElement('label');l.innerHTML='Speed <b id="v_sp">3</b>';const r=document.createElement('input');r.type='range';r.min=1;r.max=12;r.step=1;r.value=3;r.oninput=()=>{speed=+r.value;$('v_sp').textContent=speed};l.appendChild(r);box.appendChild(l);
  const l2=document.createElement('label');l2.innerHTML='Twin offset <b id="v_sep">1e-6</b>';const r2=document.createElement('input');r2.type='range';r2.min=-8;r2.max=-1;r2.step=.5;r2.value=-6;r2.oninput=()=>{sep0=Math.pow(10,+r2.value);$('v_sep').textContent='1e'+r2.value;resetState()};l2.appendChild(r2);box.appendChild(l2)}
let speed=3;
const cv=$('c'),cx=cv.getContext('2d');
function proj(p){const S=SYS[cur];const x=p[0]-S.ctr[0],y=p[1]-S.ctr[1],z=p[2]-S.ctr[2];
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const x1=x*cy-y*sy,y1=x*sy+y*cy;const y2=y1*cp-z*sp,z2=y1*sp+z*cp;
  const sc=Math.min(cv.width,cv.height)/(S.scale*3.2)*zoom;
  return [cv.width/2+x1*sc,cv.height/2-z2*sc*1+y2*0,z2]}
function proj2(p){ // top-down tilt: x on screen horizontal, z vertical, y depth for shading
  const S=SYS[cur];const x=p[0]-S.ctr[0],y=p[1]-S.ctr[1],z=p[2]-S.ctr[2];
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const x1=x*cy-y*sy,y1=x*sy+y*cy;const vy=z*cp-y1*sp,depth=z*sp+y1*cp;
  const sc=Math.min(cv.width,cv.height)*0.44/S.scale*zoom;
  return [cv.width/2+x1*sc,cv.height/2-vy*sc,depth]}
function draw(){
  const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;const w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  cx.fillStyle='#07090d';cx.fillRect(0,0,cv.width,cv.height);
  const S=SYS[cur];
  const drawTrail=(t,hue)=>{
    const n=t.length;if(n<2)return;
    for(let i=1;i<n;i++){
      const a=proj2(t[i-1]),b=proj2(t[i]);const age=i/n;
      cx.strokeStyle=`hsla(${hue+age*50},90%,${40+age*25}%,${0.12+age*0.88})`;cx.lineWidth=(0.6+age*1.6)*dpr;
      cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke();
    }
    const e=proj2(t[n-1]);cx.fillStyle=`hsl(${hue+50},100%,75%)`;cx.beginPath();cx.arc(e[0],e[1],3.5*dpr,0,6.3);cx.fill();
  };
  drawTrail(trailA,200);
  if(twin)drawTrail(trailB,20);
  if(twin){const d=Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]);$('info').textContent=S.note+'  Twin separation: '+d.toExponential(2)}
}
let drag=null;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);spin=false;$('bSpin').classList.remove('on')});
cv.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.3,Math.min(4,zoom*(e.deltaY<0?1.1:.9)))},{passive:false});
function frame(){
  if(!paused){const S=SYS[cur];
    for(let i=0;i<speed*4;i++){A=rk4(A,S.dt);if(twin)B=rk4(B,S.dt);
      if(i%2==0){trailA.push(A.slice());if(twin)trailB.push(B.slice())}}
    if(trailA.length>MAX)trailA.splice(0,trailA.length-MAX);if(trailB.length>MAX)trailB.splice(0,trailB.length-MAX);
    if(!isFinite(A[0])||Math.abs(A[0])>1e6){resetState()}
    if(spin)yaw+=.004}
  draw();requestAnimationFrame(frame)}
const sel=$('sys');for(const k in SYS){const o=document.createElement('option');o.value=k;o.textContent=SYS[k].name;sel.appendChild(o)}
sel.onchange=()=>loadSys(sel.value);
$('bTwin').onclick=e=>{twin=!twin;e.target.classList.toggle('on',twin);if(twin){B=A.slice();B[0]+=sep0;trailB=[]}};
$('bSpin').onclick=e=>{spin=!spin;e.target.classList.toggle('on',spin)};
$('bPause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause'};
$('bReset').onclick=resetState;
$('bFS').onclick=()=>{const el=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}};
loadSys('lorenz');frame();
})();
</script>
</body>
</html>
