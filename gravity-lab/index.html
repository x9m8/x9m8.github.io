<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Lab</title>
<meta name="description" content="N-body gravity sandbox: drag to launch bodies, load the solar system, a binary star or the three-body figure-eight, and change Newton's constant live.">
<style>
  :root{--bg:#070a12;--panel:#10141f;--panel2:#171c2b;--line:#262d40;--text:#e7eaf2;--muted:#8b93a9;--accent:#79b8ff;--accent2:#ffb454;--radius:10px;
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f6fa;--panel:#fff;--panel2:#eceff5;--line:#d7dce8;--text:#141826;--muted:#5d6579;--accent:#2b6cb0;--accent2:#c27413}}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.4}
  .app{display:grid;grid-template-rows:auto 1fr auto;height:100%;min-height:520px}
  header{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600}
  .stats{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}.stats b{color:var(--text);font-weight:600}
  .stage{position:relative;background:#03050b;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  .hud{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11px;color:#9aa3bb;pointer-events:none;background:rgba(3,5,11,.55);padding:4px 8px;border-radius:6px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel)}
  .group{display:flex;align-items:center;gap:6px}label{color:var(--muted);font-size:12px;white-space:nowrap}
  select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
  button.primary{background:var(--accent);color:#07101c;border-color:transparent;font-weight:600;min-width:72px}
  button:hover{filter:brightness(1.08)}select:focus,button:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
  input[type=range]{accent-color:var(--accent);width:110px}
  .toggle{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;cursor:pointer}.toggle input{accent-color:var(--accent)}
  .hint{width:100%;color:var(--muted);font-size:12px}.hint kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
  .val{font-family:var(--mono);font-size:12px;color:var(--text);min-width:44px}
  @media (max-width:640px){.stats{width:100%;margin-left:0}input[type=range]{width:80px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">Gravity Lab</h1>
    <div class="stats"><span>bodies <b id="nb">0</b></span><span>t <b id="time">0</b></span><span>energy <b id="energy">0</b></span><span id="fps"></span></div>
  </header>
  <div class="stage"><canvas id="c"></canvas><div class="hud" id="hud">drag on empty space to launch a body · scroll to zoom · right-drag or two fingers to pan</div></div>
  <div class="controls">
    <div class="group">
      <button class="primary" id="play">Pause</button>
      <button id="step" title="Advance one step">Step</button>
      <button id="clear">Clear</button>
    </div>
    <div class="group"><label for="preset">Preset</label>
      <select id="preset">
        <option value="solar">Inner solar system</option>
        <option value="binary">Binary star with planet</option>
        <option value="figure8">Three-body figure-eight</option>
        <option value="cluster">Random cluster (200)</option>
        <option value="galaxy">Disc galaxy (600)</option>
        <option value="moon">Earth and Moon</option>
        <option value="empty">Empty</option>
      </select></div>
    <div class="group"><label for="g">G</label><input type="range" id="g" min="-1" max="1.5" step="0.01" value="0"><span class="val" id="gval">1.00×</span></div>
    <div class="group"><label for="dt">Speed</label><input type="range" id="dt" min="0.05" max="4" step="0.05" value="1"><span class="val" id="dtval">1.00×</span></div>
    <div class="group"><label for="mass">New mass</label><input type="range" id="mass" min="-1" max="3" step="0.05" value="0"><span class="val" id="massval">1</span></div>
    <label class="toggle"><input type="checkbox" id="trails" checked> trails</label>
    <label class="toggle"><input type="checkbox" id="merge" checked> merge on collision</label>
    <label class="toggle"><input type="checkbox" id="com"> follow centre of mass</label>
    <div class="hint">G slider is logarithmic (0.1× to 30×). Negative G makes gravity repel. <kbd>Space</kbd> play/pause · <kbd>R</kbd> reload preset · <kbd>C</kbd> clear</div>
  </div>
</div>
<script>
(() => {
  // ---------- state ----------
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  const $=id=>document.getElementById(id);
  const ui={play:$('play'),step:$('step'),clear:$('clear'),preset:$('preset'),g:$('g'),gval:$('gval'),dt:$('dt'),dtval:$('dtval'),mass:$('mass'),massval:$('massval'),
            trails:$('trails'),merge:$('merge'),com:$('com'),nb:$('nb'),time:$('time'),energy:$('energy'),fps:$('fps'),hud:$('hud')};
  let bodies=[], running=true, t=0, dpr=Math.max(1,Math.min(2,devicePixelRatio||1));
  let view={x:0,y:0,scale:1};         // world->screen: screen = (world - view.xy)*scale + centre
  let G=1, dt=0.01, BASE_G=1;
  let colors=['#79b8ff','#ffb454','#ff7b72','#7ee787','#d2a8ff','#ffa657','#56d4dd','#f778ba'];
  const softening=0.02;               // Plummer softening (world units)

  function body(x,y,vx,vy,m,color,r){return {x,y,vx,vy,ax:0,ay:0,m,color:color||colors[bodies.length%colors.length],r:r||radiusFor(m),trail:[]}}
  function radiusFor(m){return 0.012*Math.cbrt(m)+0.004}

  // ---------- presets (world units: 1 = 1 AU-ish; velocities tuned for G=1, M_sun=1) ----------
  const PRESETS={
    solar(){ // circular orbits around a unit mass; distances in AU, periods scale as Kepler
      const list=[body(0,0,0,0,1,'#ffd866',0.05)];
      const planets=[['#9aa0a6',0.39,1.7e-7],['#e6c88a',0.72,2.4e-6],['#79b8ff',1.0,3.0e-6],['#ff7b72',1.52,3.2e-7]];
      for(const [c,a,m] of planets){const v=Math.sqrt(1/a); list.push(body(a,0,0,v,m,c,0.012));}
      return {list,scale:160,title:'Inner solar system: Mercury, Venus, Earth, Mars'};
    },
    binary(){
      const m1=0.6,m2=0.4,d=0.5; const M=m1+m2; const v=Math.sqrt(M/d);
      const list=[body(-d*m2/M,0,0,-v*m2/M,m1,'#ffd866',0.045), body(d*m1/M,0,0,v*m1/M,m2,'#ff9f5a',0.038)];
      const a=1.8; list.push(body(a,0,0,Math.sqrt(M/a),1e-4,'#79b8ff',0.012));
      return {list,scale:150,title:'Binary star with a circumbinary planet'};
    },
    figure8(){ // Chenciner–Montgomery initial conditions (G=1, m=1)
      const x1=0.97000436,y1=-0.24308753,vx3=-0.93240737,vy3=-0.86473146;
      const list=[body(x1,y1,-vx3/2,-vy3/2,1,'#79b8ff',0.03), body(-x1,-y1,-vx3/2,-vy3/2,1,'#ffb454',0.03), body(0,0,vx3,vy3,1,'#ff7b72',0.03)];
      return {list,scale:180,title:'Three-body figure-eight (Chenciner & Montgomery)',dt:0.004};
    },
    cluster(){
      const list=[]; for(let i=0;i<200;i++){const r=Math.sqrt(Math.random())*1.2, a=Math.random()*Math.PI*2; const m=0.002+Math.random()*0.004;
        list.push(body(r*Math.cos(a),r*Math.sin(a),(Math.random()-.5)*0.15,(Math.random()-.5)*0.15,m,null,0.006));}
      return {list,scale:160,title:'Random cluster of 200 bodies collapsing under its own gravity'};
    },
    galaxy(){
      const list=[body(0,0,0,0,3,'#ffd866',0.06)]; const N=600;
      for(let i=0;i<N;i++){const r=0.25+Math.pow(Math.random(),0.7)*1.6, a=Math.random()*Math.PI*2; const v=Math.sqrt(3/r)*(0.98+Math.random()*0.04);
        list.push(body(r*Math.cos(a),r*Math.sin(a),-v*Math.sin(a),v*Math.cos(a),0.0005,colors[(i%4)+4],0.004));}
      return {list,scale:120,title:'Disc of 600 test bodies around a central mass',dt:0.006};
    },
    moon(){
      const mE=1, mM=0.0123, d=0.6; const M=mE+mM; const v=Math.sqrt(M/d);
      return {list:[body(-d*mM/M,0,0,-v*mM/M,mE,'#79b8ff',0.05), body(d*mE/M,0,0,v*mE/M,mM,'#c9c9c9',0.018)],scale:260,title:'Earth and Moon (mass ratio 81:1, distance exaggerated)'};
    },
    empty(){return {list:[],scale:160,title:'Empty: drag to launch bodies'}}
  };

  function load(name){
    const p=PRESETS[name](); bodies=p.list; view={x:0,y:0,scale:p.scale}; t=0; dt=p.dt||0.01; ui.dt.value=1; ui.dtval.textContent='1.00×';
    ui.title.textContent=p.title; ui.g.value=0; G=BASE_G; ui.gval.textContent='1.00×'; computeAccel(); draw(true);
  }
  ui.title=$('title');

  // ---------- physics: velocity Verlet with O(n²) direct summation, Barnes–Hut for n>150 ----------
  function computeAccel(){
    const n=bodies.length; for(const b of bodies){b.ax=0;b.ay=0;}
    if(n>150){ bhAccel(); return; }
    for(let i=0;i<n;i++){const a=bodies[i];
      for(let j=i+1;j<n;j++){const b=bodies[j];
        let dx=b.x-a.x, dy=b.y-a.y; const d2=dx*dx+dy*dy+softening*softening; const inv=1/Math.sqrt(d2); const inv3=inv*inv*inv;
        const f=G*inv3; a.ax+=f*b.m*dx; a.ay+=f*b.m*dy; b.ax-=f*a.m*dx; b.ay-=f*a.m*dy; }}
  }
  // Barnes–Hut quadtree
  function bhAccel(){
    let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
    for(const b of bodies){if(b.x<minx)minx=b.x;if(b.x>maxx)maxx=b.x;if(b.y<miny)miny=b.y;if(b.y>maxy)maxy=b.y;}
    const size=Math.max(maxx-minx,maxy-miny)*1.01+1e-6, cx=(minx+maxx)/2, cy=(miny+maxy)/2;
    const nodes=[]; // flat arrays for speed
    function mk(x,y,s){nodes.push({x,y,s,m:0,cx:0,cy:0,b:null,kids:null});return nodes.length-1;}
    const root=mk(cx,cy,size);
    function insert(ni,b){const nd=nodes[ni];
      if(nd.m===0&&!nd.kids){nd.b=b;nd.m=b.m;nd.cx=b.x;nd.cy=b.y;return;}
      if(!nd.kids){nd.kids=[-1,-1,-1,-1]; const ob=nd.b; nd.b=null; place(ni,ob);}
      place(ni,b); nd.cx=(nd.cx*nd.m+b.x*b.m)/(nd.m+b.m); nd.cy=(nd.cy*nd.m+b.y*b.m)/(nd.m+b.m); nd.m+=b.m;
    }
    function place(ni,b){const nd=nodes[ni]; const q=(b.x>nd.x?1:0)+(b.y>nd.y?2:0); const h=nd.s/4;
      if(nd.kids[q]<0){nd.kids[q]=mk(nd.x+(q&1?h:-h),nd.y+(q&2?h:-h),nd.s/2);} insert(nd.kids[q],b);}
    for(const b of bodies) insert(root,b);
    const theta=0.6;
    for(const b of bodies){ const stack=[root];
      while(stack.length){const nd=nodes[stack.pop()]; if(nd.m===0)continue;
        let dx=nd.cx-b.x, dy=nd.cy-b.y; const d2=dx*dx+dy*dy;
        if(!nd.kids || nd.s*nd.s < theta*theta*d2){ if(nd.b===b)continue; const inv=1/Math.sqrt(d2+softening*softening); const f=G*nd.m*inv*inv*inv; b.ax+=f*dx; b.ay+=f*dy; }
        else for(const k of nd.kids) if(k>=0) stack.push(k); } }
  }
  function step(){
    const h=dt*(+ui.dt.value);
    for(const b of bodies){b.vx+=0.5*h*b.ax;b.vy+=0.5*h*b.ay;b.x+=h*b.vx;b.y+=h*b.vy;}
    computeAccel();
    for(const b of bodies){b.vx+=0.5*h*b.ax;b.vy+=0.5*h*b.ay;}
    if(ui.merge.checked) mergeCollisions();
    if(ui.trails.checked){for(const b of bodies){b.trail.push(b.x,b.y); if(b.trail.length>400)b.trail.splice(0,2);}}
    t+=h;
  }
  function mergeCollisions(){
    const n=bodies.length; if(n>400) return; // skip for big swarms
    for(let i=0;i<n;i++){const a=bodies[i]; if(!a)continue;
      for(let j=i+1;j<n;j++){const b=bodies[j]; if(!b)continue;
        const dx=b.x-a.x,dy=b.y-a.y; const rr=a.r+b.r; if(dx*dx+dy*dy<rr*rr*0.6){
          const M=a.m+b.m; a.x=(a.x*a.m+b.x*b.m)/M; a.y=(a.y*a.m+b.y*b.m)/M; a.vx=(a.vx*a.m+b.vx*b.m)/M; a.vy=(a.vy*a.m+b.vy*b.m)/M;
          if(b.m>a.m){a.color=b.color;} a.m=M; a.r=Math.max(a.r,b.r,radiusFor(M)); bodies[j]=null; }}}
    bodies=bodies.filter(Boolean);
  }
  function energy(){ let ke=0,pe=0; const n=bodies.length; if(n>300) return NaN;
    for(let i=0;i<n;i++){const a=bodies[i]; ke+=0.5*a.m*(a.vx*a.vx+a.vy*a.vy);
      for(let j=i+1;j<n;j++){const b=bodies[j]; const d=Math.hypot(b.x-a.x,b.y-a.y)+softening; pe-=G*a.m*b.m/d;}} return ke+pe; }

  // ---------- rendering ----------
  function resize(){const st=canvas.parentElement; canvas.width=st.clientWidth*dpr; canvas.height=st.clientHeight*dpr; draw(true);}
  function toScreen(x,y){return [(x-view.x)*view.scale*dpr+canvas.width/2,(y-view.y)*view.scale*dpr+canvas.height/2];}
  function toWorld(sx,sy){return [(sx*dpr-canvas.width/2)/(view.scale*dpr)+view.x,(sy*dpr-canvas.height/2)/(view.scale*dpr)+view.y];}
  function draw(full){
    if(ui.com.checked&&bodies.length){let M=0,cx=0,cy=0;for(const b of bodies){M+=b.m;cx+=b.x*b.m;cy+=b.y*b.m;} view.x=cx/M; view.y=cy/M;}
    ctx.fillStyle=ui.trails.checked&&!full?'rgba(3,5,11,0.18)':'#03050b'; ctx.fillRect(0,0,canvas.width,canvas.height);
    if(full&&ui.trails.checked){ // redraw stored trails after a full clear
      ctx.lineWidth=1*dpr; for(const b of bodies){ if(b.trail.length<4)continue; ctx.strokeStyle=b.color; ctx.globalAlpha=0.35; ctx.beginPath();
        for(let i=0;i<b.trail.length;i+=2){const [sx,sy]=toScreen(b.trail[i],b.trail[i+1]); i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy);} ctx.stroke();} ctx.globalAlpha=1; }
    for(const b of bodies){const [sx,sy]=toScreen(b.x,b.y); const r=Math.max(1.2*dpr,b.r*view.scale*dpr);
      ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
      if(r>4*dpr){ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(sx-r*0.3,sy-r*0.3,r*0.3,0,Math.PI*2); ctx.fill();}}
    if(drag){const [sx,sy]=toScreen(drag.x,drag.y); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5*dpr; ctx.setLineDash([6*dpr,4*dpr]); ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(drag.cx*dpr,drag.cy*dpr); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(sx,sy,Math.max(3*dpr,radiusFor(newMass())*view.scale*dpr),0,Math.PI*2); ctx.fill();}
    ui.nb.textContent=bodies.length; ui.time.textContent=t.toFixed(2); const e=energy(); ui.energy.textContent=isNaN(e)?'—':e.toFixed(4);
  }
  let frames=0,fpsT=performance.now();
  function loop(now){ if(running){const substeps=bodies.length>300?1:4; for(let i=0;i<substeps;i++)step(); draw(false);} else if(drag) draw(true);
    frames++; if(now-fpsT>1000){ui.fps.textContent=frames+' fps'; frames=0; fpsT=now;} requestAnimationFrame(loop); }

  // ---------- input ----------
  let drag=null, pan=null, pointers=new Map(), pinch=null;
  function newMass(){return Math.pow(10,+ui.mass.value);}
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId,[e.clientX,e.clientY]);
    const rect=canvas.getBoundingClientRect(); const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    if(pointers.size===2){drag=null; const pts=[...pointers.values()]; pinch={d:Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]),scale:view.scale,mid:[(pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2],vx:view.x,vy:view.y}; return;}
    if(e.button===2||e.shiftKey){pan={sx:cx,sy:cy,vx:view.x,vy:view.y}; return;}
    const [wx,wy]=toWorld(cx,cy); drag={x:wx,y:wy,cx,cy}; });
  canvas.addEventListener('pointermove',e=>{ if(!pointers.has(e.pointerId))return; pointers.set(e.pointerId,[e.clientX,e.clientY]);
    const rect=canvas.getBoundingClientRect(); const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    if(pinch&&pointers.size===2){const pts=[...pointers.values()]; const d=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]); view.scale=pinch.scale*d/pinch.d;
      const mid=[(pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2]; view.x=pinch.vx-(mid[0]-pinch.mid[0])/view.scale; view.y=pinch.vy-(mid[1]-pinch.mid[1])/view.scale; draw(true); return;}
    if(pan){view.x=pan.vx-(cx-pan.sx)/view.scale; view.y=pan.vy-(cy-pan.sy)/view.scale; draw(true); return;}
    if(drag){drag.cx=cx;drag.cy=cy; if(!running)draw(true);} });
  function up(e){ pointers.delete(e.pointerId); pinch=null;
    if(pan){pan=null;return;}
    if(drag){const [wx,wy]=toWorld(drag.cx,drag.cy); const k=0.9; // velocity = drag vector scaled
      bodies.push(body(drag.x,drag.y,(wx-drag.x)*k*Math.sqrt(view.scale/160),(wy-drag.y)*k*Math.sqrt(view.scale/160),newMass(),null,radiusFor(newMass()))); computeAccel(); drag=null; draw(true);} }
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{e.preventDefault(); const rect=canvas.getBoundingClientRect(); const [wx,wy]=toWorld(e.clientX-rect.left,e.clientY-rect.top);
    const f=Math.exp(-e.deltaY*0.0015); view.scale*=f; const [wx2,wy2]=toWorld(e.clientX-rect.left,e.clientY-rect.top); view.x+=wx-wx2; view.y+=wy-wy2; draw(true);},{passive:false});

  ui.play.addEventListener('click',()=>{running=!running; ui.play.textContent=running?'Pause':'Play';});
  ui.step.addEventListener('click',()=>{step();draw(true);});
  ui.clear.addEventListener('click',()=>{bodies=[];t=0;draw(true);});
  ui.preset.addEventListener('change',()=>load(ui.preset.value));
  ui.g.addEventListener('input',()=>{const v=+ui.g.value; G=v<0?-Math.pow(10,-v-1)*BASE_G*10:Math.pow(10,v)*BASE_G; // negative side: repulsive
    ui.gval.textContent=(G/BASE_G).toFixed(2)+'×'; computeAccel();});
  ui.dt.addEventListener('input',()=>ui.dtval.textContent=(+ui.dt.value).toFixed(2)+'×');
  ui.mass.addEventListener('input',()=>ui.massval.textContent=newMass()<0.01?newMass().toExponential(1):newMass().toFixed(2));
  ui.trails.addEventListener('change',()=>draw(true)); ui.com.addEventListener('change',()=>draw(true));
  window.addEventListener('resize',resize);
  window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
    if(e.code==='Space'){e.preventDefault();ui.play.click();} else if(e.key.toLowerCase()==='r')load(ui.preset.value); else if(e.key.toLowerCase()==='c')ui.clear.click();});

  // ---------- query params: ?preset=figure8&g=1&speed=1&trails=0&autoplay=0 ----------
  const q=new URLSearchParams(location.search);
  if(q.has('preset')&&PRESETS[q.get('preset')]) ui.preset.value=q.get('preset');
  if(q.has('trails')) ui.trails.checked=q.get('trails')!=='0';
  if(q.get('autoplay')==='0'){running=false; ui.play.textContent='Play';}
  resize(); load(ui.preset.value);
  if(q.has('speed')){ui.dt.value=Math.max(0.05,Math.min(4,+q.get('speed')||1)); ui.dtval.textContent=(+ui.dt.value).toFixed(2)+'×';}
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
